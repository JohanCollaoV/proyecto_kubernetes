services:
  mysql:
    image: mysql:8.0
    container_name: msvc-mysql
    restart: unless-stopped
    environment:
        MYSQL_DATABASE: msvc_usuarios
        MYSQL_USER: johandev
        MYSQL_PASSWORD: Tropelias.1.
        MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  postgres:
    image: postgres:16
    container_name: msvc-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: msvc_cursos
      POSTGRES_USER: johandev
      POSTGRES_PASSWORD: Tropelias.1.1
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
  
volumes:
  mysql_data:
  postgres_data: